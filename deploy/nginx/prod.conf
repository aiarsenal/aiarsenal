# ============================================================
# AI Arsenal nginx 配置 —— 生产环境 (aiarsenal.cc)
# 由 deploy.sh prod 拷贝到 /etc/nginx/conf.d/aiarsenal.cc.conf 生效
# 证书由 acme.sh 签发并安装至 /etc/nginx/ssl/aiarsenal.cc.*（不入库）
# UI 静态资源: /home/ubuntu/aiarsenal/ui/dist
# API 反代:   127.0.0.1:43211 (aiarsenal-api.service)
# ============================================================

# ---------- UI: aiarsenal.cc ----------
server {
    listen 80;
    listen [::]:80;
    server_name aiarsenal.cc;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiarsenal.cc;

    ssl_certificate     /etc/nginx/ssl/aiarsenal.cc.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aiarsenal.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/ubuntu/aiarsenal/ui/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html 不缓存，确保浏览器始终拿到最新版本（JS/CSS 文件名带 hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ---------- API: api.aiarsenal.cc → 127.0.0.1:43211 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.aiarsenal.cc;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aiarsenal.cc;

    ssl_certificate     /etc/nginx/ssl/aiarsenal.cc.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aiarsenal.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:43211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------- MCP 网关: mcp.aiarsenal.cc → 127.0.0.1:43213 (aiarsenal-mcp.service) ----------
# 面向 AI 客户端(Claude Desktop/Cursor)的 MCP 协议端点(SSE + streamable-http)。
# 长连接：关缓冲、长超时、HTTP/1.1 keep-alive，确保 SSE 流实时下发。
server {
    listen 80;
    listen [::]:80;
    server_name mcp.aiarsenal.cc;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.aiarsenal.cc;

    ssl_certificate     /etc/nginx/ssl/aiarsenal.cc.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aiarsenal.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:43213;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/streamable-http：关缓冲，flush 实时下发
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 长会话：保持 24h，避免中途断连
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ---------- LLM 网关: llm.aiarsenal.cc → 127.0.0.1:43214 (aiarsenal-llm.service) ----------
