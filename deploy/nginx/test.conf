# ============================================================
# AI Arsenal nginx 配置 —— 测试环境 (aiarsenal.cc，纯 HTTP + /etc/hosts 本机解析)
# 由 deploy.sh test 拷贝到 /etc/nginx/conf.d/aiarsenal.cc.conf 生效
# 测试环境不走 HTTPS/证书：目标机用 /etc/hosts 把 *.aiarsenal.cc 指向 127.0.0.1，
# 浏览器以 http://aiarsenal.cc 访问。生产环境走 prod.conf（HTTPS + 真实证书）。
# UI 静态资源: /home/ubuntu/aiarsenal/ui/dist
# API 反代:   127.0.0.1:43211 (aiarsenal-api.service)
# ============================================================

# ---------- UI: aiarsenal.cc ----------
server {
    listen 80;
    listen [::]:80;
    server_name aiarsenal.cc;

    root /home/ubuntu/aiarsenal/ui/dist;
    index index.html;

    # 桌面同源反代：iframe 走 aiarsenal.cc（与 UI 同源），转发到 api 的 DesktopProxy（含 WebSocket）。
    # 直连容器端口会触发跨域，故走同源反代。
    # ^~ 让本前缀优先于下面的 \.(js|css) 正则，否则桌面 SPA 的 assets/*.js 会被正则拦走从 ui/dist 404。
    location ^~ /api/v1/agent/instance/ {
        proxy_pass http://127.0.0.1:43211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html 不缓存，确保浏览器始终拿到最新版本（JS/CSS 文件名带 hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ---------- API: api.aiarsenal.cc → 127.0.0.1:43211 ----------
# X-Forwarded-Proto=$scheme 必传：api 依此推导 LLM 网关 scheme（测试 http / 生产 https）。
server {
    listen 80;
    listen [::]:80;
    server_name api.aiarsenal.cc;

    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:43211;
        proxy_http_version 1.1;
        # 大文件上传直通后端不在 nginx 落临时盘（client_body_temp 权限问题时会 500）
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------- MCP 网关: mcp.aiarsenal.cc → 127.0.0.1:43213 (aiarsenal-mcp.service) ----------
# 面向 AI 客户端(Claude Desktop/Cursor)的 MCP 协议端点(SSE + streamable-http)。
# 长连接：关缓冲、长超时、HTTP/1.1 keep-alive，确保 SSE 流实时下发。
server {
    listen 80;
    listen [::]:80;
    server_name mcp.aiarsenal.cc;

    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:43213;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/streamable-http：关缓冲，flush 实时下发
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # 长会话：保持 24h，避免中途断连
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ---------- LLM 网关: llm.aiarsenal.cc → 127.0.0.1:43214 (aiarsenal-llm.service) ----------
# OpenAI 兼容端点 /v1/chat/completions 等（SSE 流式）。长连接：关缓冲、长超时。
server {
    listen 80;
    listen [::]:80;
    server_name llm.aiarsenal.cc;

    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:43214;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式：关缓冲，flush 实时下发
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
