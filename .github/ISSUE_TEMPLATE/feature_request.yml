name: 功能建议 / Feature Request
description: 提出一个新功能或改进 / Suggest a new feature or improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议!请先搜索既有 issue,避免重复。
        Thanks for the suggestion — please search existing issues first to avoid duplicates.

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use Case
      description: |
        你想解决什么问题?谁会在什么情况下用到?
        What problem are you trying to solve, and who would use it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: |
        你期望的功能形态与交互(界面草图、命令示例、API 形态均可)。
        The behavior / UX you expect (mockups, command examples, API shape all welcome).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 你还考虑过哪些替代做法 / Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿 / Willingness to Contribute
      options:
        - label: 我愿意提交 PR 实现这个功能 / I am willing to submit a PR for this feature
          required: false
