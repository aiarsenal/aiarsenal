name: Deploy Pages

# 官网（homepage/ 静态站）→ GitHub Pages：push master 即部署。
# 仓库 Settings → Pages 需将 Source 设为 GitHub Actions；自定义域名见 homepage/CNAME。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage
      - id: deployment
        uses: actions/deploy-pages@v4
